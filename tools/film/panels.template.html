<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts" href="/*FONT_URL*/" rel="stylesheet">
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1600px; height: 900px; overflow: hidden; background: #000; }
  .shot { position: absolute; inset: 0; opacity: 0; }
  .shot .bgfill { position: absolute; inset: -4%; background-size: cover; background-position: center; }
  .shot .cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .shot .panel { position: absolute; left: 111px; top: 0; height: 900px; width: 1378px; background-size: 100% 100%; }
  .shot .panel.art { box-shadow: 14px 14px 0 rgba(0,0,0,.85), 0 0 60px rgba(0,0,0,.7); }
  .shot .panel.slice { position: absolute; }
  .shot .frame { position: absolute; left: 114px; top: 3px; width: 1372px; height: 894px; box-sizing: border-box; border: 6px solid #141414; pointer-events: none; }
  .fx { position: absolute; pointer-events: none; }
  .fx.cover { backdrop-filter: blur(12px) brightness(0.3); -webkit-backdrop-filter: blur(12px) brightness(0.3);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%), linear-gradient(180deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
    -webkit-mask-composite: source-in; mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%), linear-gradient(180deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%); mask-composite: intersect; }
  .fx.copy { background-size: 1378px 900px; }
  .fx.scanline { height: 22px; margin-top: -11px; mix-blend-mode: screen; background: linear-gradient(180deg, rgba(160,235,255,0) 0%, rgba(200,245,255,.95) 50%, rgba(160,235,255,0) 100%); }
  .fx.glow { mix-blend-mode: screen; filter: blur(18px); }
  .fx.pulse { mix-blend-mode: screen; filter: brightness(1.7) saturate(1.8); }
  .fx.sweep { left: -50%; top: -20%; width: 200%; height: 140%; mix-blend-mode: screen; background: linear-gradient(105deg, transparent 44%, rgba(255,255,255,.28) 50%, transparent 56%); }
  .fx.cursor { backdrop-filter: blur(9px) brightness(0.85); -webkit-backdrop-filter: blur(9px) brightness(0.85); }
  .fx.shine { overflow: hidden; mix-blend-mode: screen; }
  .fx.shine > div { position: absolute; top: -20%; width: 40%; height: 140%; background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.55) 50%, transparent 80%); }
  .fx.text { overflow: visible; }
  .fx.text .tw { width: 100%; height: 100%; transform-origin: 50% 50%; }
  .fx.text .tx { width: 100%; height: 100%; }
  .fx.spin { mix-blend-mode: screen; overflow: visible; }
  .fx.spin circle { fill: none; stroke-linecap: round; }
  .fx.ripple { mix-blend-mode: screen; overflow: visible; }
  .fx.ripple circle { fill: none; stroke-width: 2px; }
  .fx.burst { overflow: visible; transform-origin: 50% 50%; mix-blend-mode: screen; }
  .fx.sprite { transform: translate(-50%, -50%); filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
  .streak { position: absolute; mix-blend-mode: screen; pointer-events: none; }
  .streak .line { position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; background: linear-gradient(90deg, rgba(127,227,255,0) 0%, rgba(255,255,255,.9) 50%, rgba(127,227,255,0) 100%); }
  .streak .wide { position: absolute; left: 0; right: 0; top: 50%; height: 10px; margin-top: -5px; opacity: .35; filter: blur(4px); background: linear-gradient(90deg, rgba(127,227,255,0) 0%, rgba(255,255,255,.9) 50%, rgba(127,227,255,0) 100%); }
  .streak .dot { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; filter: blur(3px); opacity: .9; }
  .hdr { position: absolute; display: flex; align-items: stretch; color: #fff; font-family: 'Oswald', 'Arial Narrow', sans-serif; opacity: 0; filter: drop-shadow(6px 6px 0 #141414); }
  .hdr .badge { display: flex; align-items: center; justify-content: center; background: #ffd23b; color: #141414; border: 3px solid #141414; border-right-width: 3px; font-family: 'Bangers', 'Oswald', sans-serif; font-weight: 400; letter-spacing: .02em; line-height: 1; box-sizing: border-box; }
  .hdr .title { display: flex; align-items: center; flex: 1; min-width: 0; background: #0b0b0d; border: 3px solid #141414; border-left: 0; font-weight: 600; letter-spacing: .06em; white-space: nowrap; line-height: 1; box-sizing: border-box; }
  .leak { position: absolute; width: 1240px; height: 840px; mix-blend-mode: screen; pointer-events: none; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.55) 100%); pointer-events: none; }
  .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 2px, transparent 2px 4px); opacity: .5; pointer-events: none; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .dim { position: absolute; inset: 0; background: #000; opacity: 0; }
  .red { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(255,40,40,.35) 0%, rgba(120,0,0,.25) 45%, transparent 75%); opacity: 0; mix-blend-mode: screen; }
  .glitchwash { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(34,211,238,.35) 0 3px, rgba(244,114,182,.3) 3px 6px, transparent 6px 9px); mix-blend-mode: screen; opacity: 0; }
  canvas { position: absolute; inset: 0; pointer-events: none; }
</style></head>
<body>
<div id="stage"></div>
<script>
const PANEL_DIR = '/*PANEL_DIR*/';
const SPRITE_DIR = '/*SPRITE_DIR*/';
/*TYPESET*/
/*FX_SPEC*/
/* ── the shot list (keep in step with client/src/components/intro/script.js) ── */
const SHOTS = [
  { file: 'panel-01.jpg', dur: 8, cut: 'fade',   mood: 'calm',          sfx: [['ambience',0],['blip',1000],['swell',2500]] },
  { file: 'panel-02.jpg', dur: 7, cut: 'fade',   mood: 'calm',          sfx: [['hum',300],['blip',1500],['blip',2100]] },
  { file: 'panel-03.jpg', dur: 6, cut: 'cut',    mood: 'mystery',       sfx: [['tick',600],['tick',1100],['tick',1600],['boom',2000],['glitch',2100],['critical',3000]], flickerAt: 2.0, shake: [2.0, 0.5] },
  { file: 'panel-04.jpg', dur: 7, cut: 'glitch', mood: 'shock',         sfx: [['glitch',200],['riser',500],['collapse',2800],['silence',3200],['blip',4500]], glitchEvery: 1.4, shake: [2.8, 0.7] },
  { file: 'panel-05.jpg', dur: 9, cut: 'fade',   mood: 'mystery',       sfx: [['blip',1500],['blip',3000],['blip',4500],['thud',6000],['thud',6600],['thud',7200],['boom',8000]], shake: [7.3, 0.45] },
  { file: 'panel-06.jpg', dur: 7, cut: 'fade',   mood: 'uncertainty',   sfx: [['swell',200],['blip',1000],['blip',1400],['blip',1800],['blip',2200],['blip',2600],['blip',3000]] },
  { file: 'panel-07.jpg', dur: 7, cut: 'fade',   mood: 'investigation', sfx: [['hum',200],['blip',900],['blip',1300],['blip',1700],['blip',2100],['blip',2500],['blip',2900],['confirm',3800],['confirm',4600]] },
  { file: 'panel-08.jpg', dur: 7, cut: 'fade',   mood: 'investigation', sfx: [['whoosh',0],['type',3000],['type',3120],['type',3240],['type',3360],['type',3480],['boom',4500]], shake: [2.2, 0.4] },
  { file: 'panel-09.jpg', dur: 7, cut: 'fade',   mood: 'investigation', sfx: [['whoosh',0],['blip',900],['blip',1400],['blip',1900],['blip',2400],['confirm',3000],['boom',5000]], shake: [5.0, 0.4] },
  { file: 'panel-10.jpg', dur: 8, cut: 'cut',    mood: 'investigation', sfx: [['cut',0],['type',1000],['type',2000],['type',3000],['type',4000],['type',5000]] },
  { file: 'panel-11.jpg', dur: 8, cut: 'fade',   mood: 'investigation', sfx: [['whoosh',0],['blip',800],['lock',1400],['lock',1900],['lock',2400],['lock',2900],['lock',3400]] },
  { file: 'panel-12.jpg', dur: 6, cut: 'flash',  mood: 'urgency',       sfx: [['cut',0],['tick',1500],['tick',2500],['thud',3500],['thud',4200],['thud',4900]], redPulse: true, shake: [1.8, 0.4] },
  { file: 'panel-13.jpg', dur: 7, cut: 'fade',   mood: 'urgency',       sfx: [['blip',1000],['blip',1400],['type',2200],['type',2600],['type',3000],['type',3400],['confirm',4400]] },
  { file: 'panel-14.jpg', dur: 6, cut: 'flash',  mood: 'urgency',       sfx: [['boom',300],['swell',1500],['blip',3500]], shake: [0.3, 0.5] },
  { file: 'panel-15.jpg', dur: 8, cut: 'fade',   mood: 'urgency',       sfx: [['silence',0],['boom',1000],['swell',1200],['confirm',4000]], shake: [1.0, 0.6] },
];
const FPS = 30;
let t0 = 0;
const PAGES = SHOTS.map((s, i) => { const p = { scene: `panel${String(i + 1).padStart(2, '0')}`, start: t0, dur: s.dur, mood: s.mood, sfx: s.sfx.map(([name, at]) => ({ name, at })), dialogue: null }; t0 += s.dur; return p; });
const TOTAL = t0;
window.__film = { TOTAL, FPS, pages: PAGES };

const easeInOut = (p) => (p < 0.5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2);
const easeOut = (p) => 1 - (1 - p) ** 3;
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const SVG = 'http://www.w3.org/2000/svg';

/* ── build the DOM ── */
const stage = document.getElementById('stage');
const shotEls = SHOTS.map((s, i) => {
  const key = `panel${String(i + 1).padStart(2, '0')}`;
  const el = document.createElement('div'); el.className = 'shot';
  el.innerHTML = `<div class="bgfill" style="background-image:url(${PANEL_DIR}${s.file.replace('.jpg','-bg.jpg')})"></div>
    <div class="cam"><div class="panel art" style="background-image:url(${PANEL_DIR}${s.file})"></div>
    <div class="panel slice s1" style="background-image:url(${PANEL_DIR}${s.file});opacity:0"></div>
    <div class="panel slice s2" style="background-image:url(${PANEL_DIR}${s.file});opacity:0"></div></div>
    <div class="hdr"></div>`;
  const cam = el.querySelector('.cam');
  const spec = FX[key] || [];
  // the header, in screen space
  const header = spec.find((f) => f.type === 'header');
  const hdr = el.querySelector('.hdr');
  if (header) {
    const b = boxPx(header.box);
    hdr.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px`;
    hdr.innerHTML = `<div class="badge" style="width:${b.h * 1.05}px;font-size:${b.h * 0.74}px">${header.n}</div><div class="title" style="padding-left:${b.h * 0.5}px;font-size:${b.h * 0.5}px">${esc(header.text)}</div>`;
  }
  // fx elements
  const fx = spec.map((f, idx) => {
    const b = f.box ? boxPx(f.box) : null;
    const mk = (cls, extra = '') => { const d = document.createElement('div'); d.className = 'fx ' + cls; if (b) d.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;` + extra; else d.style.cssText = extra; cam.appendChild(d); return d; };
    const artCopy = (cls, extra = '') => mk(cls + ' copy', `background-image:url(${PANEL_DIR}${s.file});background-position:${-(b.x - PX)}px ${-b.y}px;opacity:0;` + extra);
    if (f.type === 'reveal') { const cover = mk('cover'); const copy = artCopy(''); const scan = mk('scanline', 'opacity:0;height:22px'); return { f, cover, copy, scan }; }
    const tilt = f.rotate ? `transform:rotate(${f.rotate}deg);transform-origin:50% 50%;` : '';
    if (f.type === 'glow') return { f, el: mk('glow', `background:radial-gradient(ellipse at center, ${f.color} 0%, transparent 70%);opacity:0;` + tilt) };
    if (f.type === 'pulse') return { f, el: artCopy('pulse', tilt) };
    if (f.type === 'sweep') return { f, el: mk('sweep', 'opacity:0') };
    if (f.type === 'cursor') return { f, el: mk('cursor', 'opacity:0') };
    if (f.type === 'flicker') return { f, el: artCopy('') };
    if (f.type === 'shine') { const d = mk('shine', 'opacity:0'); d.innerHTML = '<div></div>'; return { f, el: d, band: d.firstChild }; }
    if (f.type === 'text') {
      const r = resolve(f);
      const d = mk('text', 'opacity:0');
      d.dataset.panel = key; d.dataset.i = idx;
      const wrap = document.createElement('div'); wrap.className = 'tw';
      const tx = document.createElement('div'); tx.className = 'tx';
      Object.assign(tx.style, textStyle(r));
      const span = document.createElement('span');
      const plate = plateStyle(r); if (plate) Object.assign(span.style, plate);
      const from = r.from || 'up';
      const toks = [];
      let caret = null;
      if (from === 'type' || from === 'words') {
        for (const tk of tokens(r, from)) {
          if (tk.lineBreak) { span.appendChild(document.createTextNode('\n')); continue; }
          if (tk.space) { span.appendChild(document.createTextNode(tk.t)); continue; }
          const sp = document.createElement('span'); sp.textContent = tk.t;
          if (tk.accent) sp.style.color = r.accent || '#7fe3ff';
          if (from === 'words') sp.style.display = 'inline-block';
          sp.style.visibility = 'hidden';
          span.appendChild(sp); toks.push(sp);
        }
        if (from === 'type') { caret = document.createElement('span'); caret.textContent = r.caretChar || '▌'; caret.style.visibility = 'hidden'; span.appendChild(caret); }
      } else {
        span.innerHTML = textRuns(r).map((runs) => runs.map((x) => (x.accent ? `<span style="color:${r.accent || '#7fe3ff'}">${esc(x.t)}</span>` : esc(x.t))).join('')).join('\n');
      }
      tx.appendChild(span); wrap.appendChild(tx); d.appendChild(wrap);
      return { f: r, el: d, wrap, tx, span, toks, caret, baseShadow: tx.style.textShadow };
    }
    if (f.type === 'spin') {
      const R = Math.min(b.w, b.h) / 2; const n = f.rings || 3; const color = f.color || '#9fe8ff';
      const svg = document.createElementNS(SVG, 'svg');
      svg.setAttribute('class', 'fx spin'); svg.setAttribute('viewBox', `${-R} ${-R} ${2 * R} ${2 * R}`);
      svg.style.cssText = `left:${b.x + b.w / 2 - R}px;top:${b.y + b.h / 2 - R}px;width:${2 * R}px;height:${2 * R}px;opacity:${f.opacity || 0.5}`;
      const rings = [];
      for (let k = 0; k < n; k += 1) {
        const r = R * (0.5 + (0.5 * k) / Math.max(1, n - 1));
        const dash = k % 2 ? `${r * 0.9} ${r * 0.5} ${r * 0.2} ${r * 0.35}` : `${r * 0.25} ${r * 0.45} ${r * 1.4} ${r * 0.6}`;
        const g = document.createElementNS(SVG, 'g');
        g.innerHTML = `<circle r="${r}" stroke="${color}" stroke-width="${k === 0 ? 3 : 2}" stroke-dasharray="${dash}"/><circle r="${r}" stroke="${color}" stroke-width="0.8" opacity="0.5"/><circle cx="${r}" cy="0" r="4" fill="${color}" stroke="none"/>`;
        svg.appendChild(g); rings.push(g);
      }
      cam.appendChild(svg);
      return { f, el: svg, rings };
    }
    if (f.type === 'ripple') {
      const R = Math.min(b.w, b.h) / 2; const n = f.rings || 3;
      const svg = document.createElementNS(SVG, 'svg');
      svg.setAttribute('class', 'fx ripple'); svg.setAttribute('viewBox', `${-R} ${-R} ${2 * R} ${2 * R}`);
      svg.style.cssText = `left:${b.x + b.w / 2 - R}px;top:${b.y + b.h / 2 - R}px;width:${2 * R}px;height:${2 * R}px`;
      const circles = [];
      for (let k = 0; k < n; k += 1) { const c = document.createElementNS(SVG, 'circle'); c.setAttribute('r', R); c.setAttribute('stroke', f.color || '#9fe8ff'); c.setAttribute('opacity', 0); svg.appendChild(c); circles.push(c); }
      cam.appendChild(svg);
      return { f, el: svg, circles, R };
    }
    if (f.type === 'burst') {
      const R = (Math.max(b.w, b.h) / 2) * (f.scale || 1.4);
      const svg = document.createElementNS(SVG, 'svg');
      svg.setAttribute('class', 'fx burst'); svg.setAttribute('viewBox', `${-R} ${-R} ${2 * R} ${2 * R}`);
      svg.style.cssText = `left:${b.x + b.w / 2 - R}px;top:${b.y + b.h / 2 - R}px;width:${2 * R}px;height:${2 * R}px;opacity:0`;
      svg.innerHTML = burstRays(f.rays || 28, idx + 1).map((r) => {
        const x0 = Math.cos(r.a) * r.r0 * R, y0 = Math.sin(r.a) * r.r0 * R, x1 = Math.cos(r.a) * r.r1 * R, y1 = Math.sin(r.a) * r.r1 * R;
        const nx = -Math.sin(r.a) * r.w * R, ny = Math.cos(r.a) * r.w * R;
        return `<polygon points="${x0 + nx},${y0 + ny} ${x0 - nx},${y0 - ny} ${x1},${y1}" fill="${f.color || '#ffffff'}"/>`;
      }).join('');
      cam.appendChild(svg);
      return { f, el: svg };
    }
    if (f.type === 'sprite') {
      const img = document.createElement('img'); img.className = 'fx sprite'; img.src = SPRITE_DIR + f.src;
      img.style.cssText = `width:${(f.w || 0.1) * PW}px;opacity:0`;
      cam.appendChild(img);
      return { f, el: img };
    }
    return { f };
  });
  // lens streaks pinned to the art
  const cinema = CINEMA[key] || {};
  const streaks = (cinema.streaks || []).map(([x, y, len]) => {
    const d = document.createElement('div'); d.className = 'streak';
    const w = len * PW;
    d.style.cssText = `left:${PX + x * PW - w / 2}px;top:${y * PH - 10}px;width:${w}px;height:20px`;
    d.innerHTML = '<div class="wide"></div><div class="line"></div><div class="dot"></div>';
    cam.appendChild(d);
    return d;
  });
  // the ink border of the comic panel, above everything in it
  const frame = document.createElement('div'); frame.className = 'frame'; cam.appendChild(frame);
  stage.appendChild(el);
  return { el, cam, hdr, fx, streaks, cinema, key };
});
const leak = document.createElement('div'); leak.className = 'leak'; stage.appendChild(leak);
const canvas = document.createElement('canvas'); canvas.width = 1600; canvas.height = 900; stage.appendChild(canvas);
const ctx = canvas.getContext('2d');
for (const cls of ['vignette', 'scan', 'red', 'glitchwash', 'flash', 'dim']) { const d = document.createElement('div'); d.className = cls; stage.appendChild(d); }
const ov = (cls) => stage.querySelector('.' + cls);

function drawParticles(t, seed, amount) {
  ctx.clearRect(0, 0, 1600, 900);
  ctx.globalCompositeOperation = 'screen';
  for (const d of bokeh(t, seed, amount)) {
    const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r);
    const c = d.warm ? '255,217,168' : '191,239,255';
    g.addColorStop(0, `rgba(${c},${d.o * 1.6})`); g.addColorStop(0.7, `rgba(${c},${d.o * 0.8})`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 34; i += 1) {
    const sp = 8 + (i % 5) * 4;
    const x = ((i * 397) % 1600 + Math.sin(t * 0.3 + i) * 30 + 1600) % 1600;
    const y = ((i * 251) % 900 - t * sp + 900 * 100) % 900;
    const a = 0.25 + 0.5 * Math.abs(Math.sin(t * 0.9 + i * 1.7));
    const r = 1.2 + (i % 3);
    ctx.fillStyle = i % 4 ? `rgba(120,220,255,${a})` : `rgba(255,255,255,${a})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
}

/* the still camera: handheld sway + the shot's knock + the cut's kick */
function camStyle(shot, t, tl, seed, extra = {}) {
  const sw = sway(t, seed);
  const sh = shot.shake ? shake(tl, shot.shake[0], shot.shake[1]) : { x: 0, y: 0 };
  return `translate(${(sw.x + sh.x + (extra.x || 0)).toFixed(2)}px, ${(sw.y + sh.y + (extra.y || 0)).toFixed(2)}px) rotate(${sw.r.toFixed(3)}deg) scale(${extra.scale || 1})`;
}

/* one line of lettering at time tl */
function applyText(item, tl) {
  const r = item.f;
  const at = r.at || 0;
  const dur = r.dur || 0.5;
  const from = r.from || 'up';
  let opacity = tl >= at ? 1 : 0;
  let transform = '';
  if (from === 'slam') {
    const p = clamp01((tl - at) / dur); const e = backOut(p);
    transform = `scale(${(2.1 - 1.1 * e).toFixed(4)}) rotate(${(-7 * (1 - e)).toFixed(3)}deg)`;
    opacity = tl < at ? 0 : Math.min(1, p * 4);
  } else if (from === 'pop') {
    const p = clamp01((tl - at) / dur); const e = backOut(p);
    transform = `scale(${(0.4 + 0.6 * e).toFixed(4)})`;
    opacity = tl < at ? 0 : Math.min(1, p * 3);
  } else if (from === 'glitch') {
    const p = clamp01((tl - at) / dur);
    if (tl >= at && p < 1) {
      const k = Math.floor((tl - at) / 0.04);
      transform = `translate(${((k % 2 ? -1 : 1) * 12 * (1 - p)).toFixed(2)}px, 0)`;
      item.tx.style.textShadow = `${(3.5 * (1 - p)).toFixed(2)}px 0 #ff2a6d, ${(-3.5 * (1 - p)).toFixed(2)}px 0 #22d3ee, ${item.baseShadow}`;
      item.tx.style.filter = k % 3 === 0 ? 'blur(1.2px)' : '';
    } else { item.tx.style.textShadow = item.baseShadow; item.tx.style.filter = ''; }
  } else if (from === 'wipe') {
    item.tx.style.clipPath = `inset(0 ${((1 - clamp01((tl - at) / dur)) * 100).toFixed(2)}% 0 0)`;
  } else if (from === 'type') {
    const cps = r.cps || TYPE_CPS;
    const n = Math.floor((tl - at) * cps);
    item.toks.forEach((sp, i) => { sp.style.visibility = i < n ? 'visible' : 'hidden'; if (r.align !== 'center') sp.style.display = i < n ? '' : 'none'; });
    const typing = tl >= at && n < item.toks.length;
    const blinkOn = Math.floor((tl - at) / 0.35) % 2 === 0;
    item.caret.style.visibility = tl >= at && (typing || (r.caret && blinkOn)) ? 'visible' : 'hidden';
  } else if (from === 'words') {
    const st = r.stagger || STAGGER;
    item.toks.forEach((sp, i) => {
      const p = clamp01((tl - at - i * st) / 0.38); const e = backOut(p);
      sp.style.visibility = p > 0 ? 'visible' : 'hidden';
      sp.style.opacity = p.toFixed(3);
      sp.style.transform = `translateY(${((1 - e) * 0.3).toFixed(3)}em) scale(${(0.5 + 0.5 * e).toFixed(4)})`;
    });
  } else {
    const p = entrance(tl, at, dur);
    const [dx, dy] = FROM[from] || FROM.up;
    transform = `translate(${(dx * (1 - p)).toFixed(2)}px, ${(dy * (1 - p)).toFixed(2)}px)`;
    opacity = tl < at ? 0 : p;
  }
  if (r.blink && tl >= at) { const ph = (((tl - at) % r.blink) + r.blink) % r.blink; opacity = ph < r.blink / 2 ? 1 : 0; }
  item.wrap.style.transform = transform;
  item.el.style.opacity = opacity;
}

/* animatic motion inside the slide */
function applyFx(list, tl) {
  for (const item of list) {
    const f = item.f;
    const at = f.at || 0;
    if (f.type === 'reveal') {
      const dur = f.dur || 0.6;
      const p = easeOut(clamp01((tl - at) / dur));
      const [dx, dy] = FROM[f.from || 'up'] || FROM.up;
      item.copy.style.opacity = tl < at ? 0 : p;
      item.copy.style.transform = `translate(${dx * (1 - p)}px, ${dy * (1 - p)}px)`;
      const coverFade = clamp01((tl - (at + dur * 0.7)) / (dur * 0.3 + 0.25));
      item.cover.style.opacity = 1 - coverFade;
      const q = clamp01((tl - at) / (dur + 0.25));
      item.scan.style.opacity = tl >= at && q < 1 ? (0.9 * (1 - q * q)).toFixed(3) : 0;
      item.scan.style.transform = `translateY(${(q * (parseFloat(item.cover.style.height) || 0)).toFixed(1)}px)`;
    } else if (f.type === 'glow' || f.type === 'pulse') {
      const on = tl >= at;
      const wave = 0.5 + 0.5 * Math.sin(((tl - at) / (f.period || 2)) * Math.PI * 2);
      item.el.style.opacity = on ? (f.opacity || 0.3) * (0.35 + 0.65 * wave) * clamp01((tl - at) / 0.5) : 0;
    } else if (f.type === 'sweep') {
      const dur = f.dur || 2;
      const p = clamp01((tl - at) / dur);
      const on = tl >= at && tl <= at + dur;
      item.el.style.opacity = on ? 1 : 0;
      item.el.style.transform = `skewX(-15deg) translateX(${(-60 + 120 * p)}%)`;
    } else if (f.type === 'cursor') {
      const period = f.period || 1;
      const phase = ((tl - at) % period + period) % period;
      item.el.style.opacity = tl >= at && phase > period / 2 ? 1 : 0;
    } else if (f.type === 'flicker') {
      const every = f.every || 1.5;
      const phase = ((tl - at) % every + every) % every;
      const on = tl >= at && phase < 0.28;
      const k = Math.floor(phase / 0.04);
      item.el.style.opacity = on ? (k % 2 ? 0.95 : 0.4) : 0;
      item.el.style.transform = on ? `translate(${(k % 2 ? -1 : 1) * 6}px, ${(k % 3 === 0 ? 1 : -1) * 3}px)` : '';
      item.el.style.filter = on ? `brightness(${k % 2 ? 1.7 : 0.6}) contrast(1.3)` : '';
    } else if (f.type === 'shine') {
      const dur = f.dur || 1.2;
      const p = clamp01((tl - at) / dur);
      const on = tl >= at && tl <= at + dur;
      item.el.style.opacity = on ? 0.8 : 0;
      item.band.style.left = `${-40 + 140 * p}%`;
    } else if (f.type === 'text') {
      applyText(item, tl);
    } else if (f.type === 'spin') {
      const dir = f.reverse ? -1 : 1;
      item.rings.forEach((g, k) => {
        const period = (f.period || 12) * (1 + k * 0.35);
        const deg = (((tl - at) / period) * 360 * dir * (k % 2 ? -1 : 1)) % 360;
        g.setAttribute('transform', `rotate(${deg.toFixed(2)})`);
      });
    } else if (f.type === 'ripple') {
      const n = item.circles.length; const period = f.period || 3; const op = f.opacity || 0.5;
      item.circles.forEach((c, k) => {
        if (tl < at) { c.setAttribute('opacity', 0); return; }
        const ph = (((tl - at) / period + k / n) % 1 + 1) % 1;
        const e = easeOut(ph);
        c.setAttribute('r', (item.R * (0.2 + 0.8 * e)).toFixed(2));
        c.setAttribute('opacity', (op * (1 - ph)).toFixed(3));
      });
    } else if (f.type === 'burst') {
      const dur = f.dur || 0.45;
      const p = clamp01((tl - at) / dur);
      const on = tl >= at && p < 1;
      // a brief flash: up fast, then away — never opaque (keep in step with ip-burst)
      const op = p < 0.12 ? (p / 0.12) * 0.6 : p < 0.55 ? 0.6 - 0.18 * ((p - 0.12) / 0.43) : 0.42 * (1 - (p - 0.55) / 0.45);
      const sc = p < 0.12 ? 0.72 + 0.28 * (p / 0.12) : p < 0.55 ? 1 + 0.1 * ((p - 0.12) / 0.43) : 1.1 + 0.1 * ((p - 0.55) / 0.45);
      item.el.style.opacity = on ? op.toFixed(3) : 0;
      item.el.style.transform = `scale(${sc.toFixed(4)})`;
    } else if (f.type === 'sprite') {
      const dur = f.dur || 8;
      const p = clamp01((tl - at) / dur);
      const w = (f.w || 0.1) * PW;
      const x = PX + (f.from[0] + (f.to[0] - f.from[0]) * p) * PW;
      const y = (f.from[1] + (f.to[1] - f.from[1]) * p) * PH - w * 0.06 * Math.sin(p * Math.PI);
      item.el.style.left = `${x.toFixed(2)}px`; item.el.style.top = `${y.toFixed(2)}px`;
      const on = tl >= at && p < 1;
      item.el.style.opacity = on ? Math.min(1, p / 0.08, (1 - p) / 0.08) : 0;
    }
  }
}

function applyShot(entry, shot, t, tl, seed, extra = {}) {
  entry.cam.style.transform = camStyle(shot, t, tl, seed, extra);
  applyFx(entry.fx, tl);
  const hp = backOut(clamp01((tl - 0.25) / 0.5));
  entry.hdr.style.opacity = tl < 0.25 ? 0 : 1;
  entry.hdr.style.transform = `translateX(${(-60 * (1 - hp)).toFixed(2)}px) scale(${(0.9 + 0.1 * hp).toFixed(4)})`;
  entry.streaks.forEach((d, i) => { d.style.opacity = 0.35 + 0.55 * (0.5 + 0.5 * Math.sin(t * 1.3 + i * 2.2 + seed)); });
}

window.renderFrame = (t) => new Promise((resolve) => {
  let idx = PAGES.findIndex((p) => t < p.start + p.dur); if (idx === -1) idx = PAGES.length - 1;
  const page = PAGES[idx]; const shot = SHOTS[idx]; const tl = t - page.start;
  shotEls.forEach(({ el }) => { el.style.opacity = 0; el.style.zIndex = 0; });
  ov('flash').style.opacity = 0; ov('glitchwash').style.opacity = 0; ov('red').style.opacity = 0;
  const prevIdx = idx - 1;
  let cur = 1;
  if (prevIdx >= 0 && shot.cut === 'fade' && tl < 0.9) {
    const pe = shotEls[prevIdx];
    pe.el.style.opacity = 1; pe.el.style.zIndex = 1;
    applyShot(pe, SHOTS[prevIdx], t, SHOTS[prevIdx].dur + tl, prevIdx + 1);
    cur = easeInOut(clamp01(tl / 0.9));
  }
  const entry = shotEls[idx]; const { el } = entry; el.style.opacity = cur; el.style.zIndex = 2;
  const extra = {};
  if ((shot.cut === 'cut' || shot.cut === 'flash') && tl < 0.5) { const q = easeOut(clamp01(tl / 0.5)); extra.scale = 1 + 0.04 * (1 - q); }
  if (shot.cut === 'flash' && tl < 0.16) ov('flash').style.opacity = (0.95 * (1 - tl / 0.16)).toFixed(3);
  if (shot.cut === 'glitch' && tl < 0.4) { const k = Math.floor(tl / 0.045); extra.x = (k % 2 ? -1 : 1) * (16 - k * 1.6); extra.y = (k % 3 === 0 ? 1 : -1) * 4; ov('glitchwash').style.opacity = 0.35 * (1 - tl / 0.4); }
  applyShot(entry, shot, t, tl, idx + 1, extra);
  const s1 = el.querySelector('.s1'); const s2 = el.querySelector('.s2');
  s1.style.opacity = 0; s2.style.opacity = 0;
  if (shot.glitchEvery) {
    const phase = tl % shot.glitchEvery;
    if (phase < 0.32) {
      const k = Math.floor(phase / 0.04);
      const y1 = 120 + ((k * 137) % 500), h1 = 18 + (k % 3) * 14;
      const y2 = 380 + ((k * 89) % 400), h2 = 12 + (k % 2) * 20;
      s1.style.opacity = 1; s1.style.clipPath = `inset(${y1}px 0 ${900 - y1 - h1}px 0)`; s1.style.transform = `translate(${(k % 2 ? -1 : 1) * (22 + k * 3)}px, 0)`; s1.style.filter = 'hue-rotate(150deg) saturate(2)';
      s2.style.opacity = 1; s2.style.clipPath = `inset(${y2}px 0 ${900 - y2 - h2}px 0)`; s2.style.transform = `translate(${(k % 2 ? 1 : -1) * (14 + k * 2)}px, 0)`; s2.style.filter = 'hue-rotate(-120deg) saturate(2)';
    }
  }
  if (shot.flickerAt != null) {
    const d = tl - shot.flickerAt;
    if (d >= 0 && d < 0.9) { const seq = [0, 0.75, 0, 0.5, 0, 0.8, 0, 0.3, 0]; ov('dim').style.opacity = seq[Math.floor(d / 0.1)] || 0; ov('flash').style.opacity = d < 0.06 ? 0.9 : 0; }
    else ov('dim').style.opacity = 0;
  } else ov('dim').style.opacity = 0;
  if (shot.redPulse) ov('red').style.opacity = 0.5 + 0.5 * Math.sin(t * 6);
  // the light leak of the shot on screen
  const cin = entry.cinema; const [c0, c1] = LEAKS[cin.leak || 'cyan']; const lp = leakPos(t, idx + 1);
  leak.style.background = `radial-gradient(ellipse at center, ${c0} 0%, ${c1} 45%, rgba(0,0,0,0) 70%)`;
  leak.style.left = `${(lp.x - 620).toFixed(1)}px`; leak.style.top = `${(lp.y - 420).toFixed(1)}px`; leak.style.opacity = (lp.o * 2.2).toFixed(3);
  const fade = Math.min(clamp01(t / 0.9), clamp01((TOTAL - t) / 1.2));
  if (fade < 1) ov('dim').style.opacity = Math.max(parseFloat(ov('dim').style.opacity || 0), 1 - fade);
  drawParticles(t, idx + 1, cin.bokeh == null ? 0.7 : cin.bokeh);
  requestAnimationFrame(() => requestAnimationFrame(() => resolve(true)));
});
</script>
